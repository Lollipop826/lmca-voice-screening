<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 心语陪伴</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    <meta name="theme-color" content="#edf5ef">
    <link rel="stylesheet" href="/static/companion_ui.css?v=20260914-unified-1">
    <script src="/static/companion_ui.js?v=20260914-unified-1" defer></script>
</head>
<body class="companion-page login-page">
    <a class="ui-skip-link" href="#auth-main">跳到登录表单</a>
    <div class="layout">
        <!-- 左侧：品牌展示 -->
        <aside class="hero">

            <div class="hero-top">
                <div class="brand">
                    <span class="brand-mark"><i class="fas fa-heart-pulse"></i></span>
                    <span>心语陪伴</span>
                </div>
            </div>

            <div class="hero-main">
                <span class="kicker">
                    <i class="fas fa-heart"></i>
                    心理健康陪伴
                </span>
                <h1 class="hero-title">
                    让日常心事<br>
                    <em>有人倾听</em>
                </h1>
                <p class="hero-desc">
                    通过语音交流、长期记忆和情绪回顾，陪您梳理日常感受。
                    按自己的节奏聊一聊，让每一次对话都能延续。
                </p>
            </div>

            <div>
                <!-- 陪伴功能 -->
                <div class="companion-capabilities" aria-label="陪伴功能">
                    <span class="pill"><i class="fas fa-microphone-lines" aria-hidden="true"></i>语音陪伴</span>
                    <span class="pill"><i class="fas fa-brain" aria-hidden="true"></i>长期记忆</span>
                    <span class="pill"><i class="fas fa-heart-pulse" aria-hidden="true"></i>情绪回顾</span>
                </div>

                <div class="hero-bottom">
                    <span><strong>·</strong> 按自己的节奏交流</span>
                    <span><strong>·</strong> 记住重要的日常</span>
                    <span><strong>·</strong> 回顾情绪变化</span>
                </div>
            </div>
        </aside>

        <!-- 右侧：登录/注册 -->
        <main class="auth-side" id="auth-main" tabindex="-1">


            <div class="auth-shell">
                <div class="card">
                    <div class="card-head">
                        <h2 class="title">欢迎使用心语陪伴</h2>
                        <p class="subtitle">登录或注册，开始今天的陪伴</p>
                    </div>

                    <div class="tabs" role="tablist" aria-label="登录或注册" data-keyboard-tabs>
                        <button id="tab-login" class="tab active" role="tab" aria-selected="true" aria-controls="login-panel" tabindex="0" type="button" onclick="switchMode('login')">登录</button>
                        <button id="tab-register" class="tab" role="tab" aria-selected="false" aria-controls="register-panel" tabindex="-1" type="button" onclick="switchMode('register')">注册</button>
                    </div>

                    <div id="login-panel" class="panel active" role="tabpanel" aria-labelledby="tab-login">
                        <form id="login-form" autocomplete="on">
                            <div class="field">
                                <label for="login-username">账号</label>
                                <input id="login-username" name="username" type="text" autocomplete="username" placeholder="请输入用户名" required>
                            </div>
                            <div class="field">
                                <label for="login-password">密码</label>
                                <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
                            </div>
                            <button id="login-submit" class="submit" type="submit">登录进入</button>
                        </form>
                        <div class="helper">
                            <span>还没有账号？</span>
                            <button type="button" class="link-btn" onclick="switchMode('register')">去注册</button>
                        </div>
                    </div>

                    <div id="register-panel" class="panel" role="tabpanel" aria-labelledby="tab-register" hidden>
                        <form id="register-form" autocomplete="on">
                            <div class="row-2">
                                <div class="field">
                                    <label for="register-username">用户名</label>
                                    <input id="register-username" name="username" type="text" autocomplete="username" placeholder="如 xiaoyu_01" required>
                                </div>
                                <div class="field">
                                    <label for="register-display-name">显示名称</label>
                                    <input id="register-display-name" name="display_name" type="text" autocomplete="name" placeholder="您希望被如何称呼" required>
                                </div>
                            </div>
                            <div class="field">
                                <label for="register-password">密码</label>
                                <input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="至少 6 位" required>
                            </div>
                            <div class="field">
                                <label for="register-password-confirm">确认密码</label>
                                <input id="register-password-confirm" name="password_confirm" type="password" autocomplete="new-password" placeholder="再次输入密码" required>
                            </div>
                            <button id="register-submit" class="submit" type="submit">创建账号</button>
                        </form>
                        <div class="helper">
                            <span>已有账号？</span>
                            <button type="button" class="link-btn" onclick="switchMode('login')">去登录</button>
                        </div>
                    </div>

                    <div id="status-box" class="status" role="status" aria-live="polite" aria-atomic="true"></div>
                </div>
            </div>

            <div class="auth-footer">
                心语陪伴 · 心理健康陪伴
            </div>
        </main>
    </div>

    <script>
        const NEXT_PATH = __NEXT_PATH__;

        function switchMode(mode) {
            const isLogin = mode !== 'register';
            document.getElementById('tab-login').classList.toggle('active', isLogin);
            document.getElementById('tab-register').classList.toggle('active', !isLogin);
            document.getElementById('tab-login').setAttribute('aria-selected', String(isLogin));
            document.getElementById('tab-register').setAttribute('aria-selected', String(!isLogin));
            document.getElementById('login-panel').classList.toggle('active', isLogin);
            document.getElementById('register-panel').classList.toggle('active', !isLogin);
            document.getElementById('tab-login').tabIndex = isLogin ? 0 : -1;
            document.getElementById('tab-register').tabIndex = isLogin ? -1 : 0;
            document.getElementById('login-panel').hidden = !isLogin;
            document.getElementById('register-panel').hidden = isLogin;
            showStatus('', 'info');
            document.getElementById(isLogin ? 'tab-login' : 'tab-register').focus();
        }

        function showStatus(message, type) {
            const box = document.getElementById('status-box');
            if (!message) {
                box.className = 'status';
                box.textContent = '';
                return;
            }
            box.className = 'status show ' + (type || 'info');
            box.textContent = message;
        }

        function normalizeError(code) {
            const map = {
                INVALID_JSON: '请求格式不正确，请刷新后重试。',
                INVALID_USERNAME: '用户名需为 3-24 位，可包含字母、数字、下划线、点号或中划线。',
                INVALID_PASSWORD: '密码长度需为 6-64 位。',
                USERNAME_EXISTS: '该用户名已存在，请更换一个。',
                INVALID_CREDENTIALS: '账号或密码错误，请重新输入。',
                UNAUTHORIZED: '当前登录已失效，请重新登录。'
            };
            return map[code] || code || '操作失败，请稍后重试。';
        }

        async function submitJson(url, payload, buttonId) {
            const button = document.getElementById(buttonId);
            const originalText = button.textContent;
            button.disabled = true;
            button.textContent = '处理中...';
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(payload)
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.success) {
                    throw new Error(normalizeError(data.error || data.message));
                }
                return data;
            } finally {
                button.disabled = false;
                button.textContent = originalText;
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            try {
                showStatus('正在验证身份...', 'info');
                await submitJson('/api/auth/login', { username, password }, 'login-submit');
                showStatus('登录成功，正在进入系统...', 'success');
                setTimeout(() => { window.location.href = NEXT_PATH || '/'; }, 300);
            } catch (error) {
                showStatus(error.message, 'error');
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = document.getElementById('register-username').value.trim();
            const display_name = document.getElementById('register-display-name').value.trim();
            const password = document.getElementById('register-password').value;
            const confirm = document.getElementById('register-password-confirm').value;
            if (password !== confirm) {
                showStatus('两次输入的密码不一致，请检查后再提交。', 'error');
                return;
            }
            try {
                showStatus('正在创建账号...', 'info');
                await submitJson('/api/auth/register', { username, display_name, password }, 'register-submit');
                showStatus('注册成功，正在进入系统...', 'success');
                setTimeout(() => { window.location.href = NEXT_PATH || '/'; }, 300);
            } catch (error) {
                showStatus(error.message, 'error');
            }
        });
    </script>
</body>
</html>
