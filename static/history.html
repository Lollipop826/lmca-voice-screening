<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陪伴记录 · 心语陪伴</title>
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    <meta name="theme-color" content="#edf5ef">
    <link rel="stylesheet" href="/static/companion_ui.css?v=20260914-unified-1">
    <script src="/static/companion_ui.js?v=20260914-unified-1" defer></script>
</head>
<body class="companion-page history-page">
    <a class="ui-skip-link" href="#history-main">跳到陪伴记录</a>
    <div class="app-shell">
        <header class="topbar page-header">
            <div class="brand">
                <div class="brand-mark"><i class="fas fa-heart-pulse" aria-hidden="true"></i></div>
                <div>
                    <h1 class="brand-title">陪伴记录</h1>
                    <div class="brand-subtitle">心语陪伴 · 回看对话与语音记录</div>
                </div>
            </div>
            <div class="topbar-actions">
                <div id="auth-user-chip" class="user-chip"><i class="fas fa-user-shield"></i><span id="auth-user-name">加载中</span></div>
                <a id="admin-link" href="/admin" hidden class="btn"><i class="fas fa-shield-halved"></i>后台</a>
                <button class="btn icon" onclick="refreshSessions()" title="刷新记录" aria-label="刷新记录"><i class="fas fa-rotate-right"></i></button>
                <a href="/" class="btn primary"><i class="fas fa-microphone-lines"></i>返回陪伴</a>
                <button id="logout-btn" class="btn danger" onclick="logoutCurrentUser()"><i class="fas fa-arrow-right-from-bracket"></i>退出</button>
            </div>
        </header>

        <main class="layout" id="history-main" tabindex="-1">
            <section class="panel list-panel">
                <div class="panel-header">
                    <div>
                        <div class="panel-title">会话列表</div>
                        <div id="list-meta" class="panel-meta">正在加载...</div>
                    </div>
                    <button id="clear-btn" class="btn" onclick="clearFilters()"><i class="fas fa-filter-circle-xmark"></i>清空</button>
                </div>
                <div class="stats-grid">
                    <div class="stat"><div class="stat-label">会话</div><div id="stat-sessions" class="stat-value">--</div></div>
                    <div class="stat"><div class="stat-label">进行中</div><div id="stat-active" class="stat-value">--</div></div>
                    <div class="stat"><div class="stat-label">语音</div><div id="stat-audio" class="stat-value">--</div></div>
                    <div class="stat"><div class="stat-label">消息</div><div id="stat-messages" class="stat-value">--</div></div>
                </div>
                <div class="filters">
                    <div class="search-row">
                        <input type="search" aria-label="搜索陪伴记录" id="search-input" class="input" placeholder="搜索用户姓名、会话ID、账号" oninput="applyFilters()">
                        <button class="btn primary" onclick="applyFilters()"><i class="fas fa-magnifying-glass"></i>搜索</button>
                    </div>
                    <div class="control-row">
                        <select aria-label="会话状态" id="status-filter" class="select" onchange="applyFilters()">
                            <option value="all">全部状态</option>
                            <option value="active">进行中</option>
                            <option value="ended">已结束</option>
                        </select>
                        <select aria-label="会话排序" id="sort-select" class="select" onchange="applyFilters()">
                            <option value="recent">最近活动优先</option>

                            <option value="audio-desc">语音最多优先</option>
                        </select>
                    </div>
                </div>
                <div id="session-list" class="session-list"><div class="loading"><i class="fas fa-spinner fa-spin"></i>加载中...</div></div>
            </section>

            <section class="panel detail-panel">
                <div id="detail-empty" class="detail-empty">
                    <div>
                        <i class="fas fa-folder-open"></i>
                        <div>选择一条会话查看详情</div>
                    </div>
                </div>

                <div id="detail-content" class="detail-content">
                    <div class="detail-summary">
                        <div>
                            <div id="detail-name" class="detail-name">--</div>
                            <div id="detail-sub" class="detail-sub"></div>
                        </div>
                        <div class="detail-actions">
                            <button id="delete-btn" class="btn danger" onclick="deleteCurrentSession()"><i class="fas fa-trash"></i>删除</button>
                            <button id="resume-btn" class="btn" onclick="resumeCurrentSession()"><i class="fas fa-play"></i>继续</button>
                            <button class="btn" onclick="exportCurrentTxt()"><i class="fas fa-file-lines"></i>TXT</button>
                            <button class="btn" onclick="exportCurrentCsv()"><i class="fas fa-file-csv"></i>CSV</button>
                            <button class="btn" onclick="downloadCurrentMergedAudio()"><i class="fas fa-wave-square"></i>总音频</button>
                            <button class="btn" onclick="downloadCurrentAudioZip()"><i class="fas fa-file-zipper"></i>音频包</button>
                        </div>
                    </div>
                    <div class="metric-strip">
                        <div class="metric"><div id="metric-mode-label" class="label">模式</div><div id="metric-mode" class="value">--</div></div>
                        <div class="metric"><div class="label">消息</div><div id="metric-messages" class="value">--</div></div>
                        <div class="metric"><div class="label">语音</div><div id="metric-audio" class="value">--</div></div>
                        <div class="metric"><div class="label">状态</div><div id="metric-status" class="value">--</div></div>
                        <div class="metric"><div class="label">归属</div><div id="metric-owner" class="value">--</div></div>
                    </div>
                    <div class="tabs" role="tablist" aria-label="记录内容" data-keyboard-tabs>
                        <button id="record-tab-messages" class="tab-btn active" data-tab="messages" role="tab" aria-selected="true" aria-controls="tab-messages" tabindex="0" onclick="switchTab('messages')"><i class="fas fa-comments"></i>对话</button>

                        <button id="record-tab-audio" class="tab-btn" data-tab="audio" role="tab" aria-selected="false" aria-controls="tab-audio" tabindex="-1" onclick="switchTab('audio')"><i class="fas fa-headphones"></i>音频</button>
                    </div>
                    <div id="tab-messages" class="tab-content active" role="tabpanel" aria-labelledby="record-tab-messages" tabindex="0"></div>

                    <div id="tab-audio" class="tab-content" role="tabpanel" aria-labelledby="record-tab-audio" tabindex="0" hidden></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const API_BASE = window.location.origin;

        let currentAuthUser = null;
        let sessions = [];
        let filteredSessions = [];
        let currentDetail = null;
        let detailRequestId = 0;
        let listRequestId = 0;
        let selectedSessionId = '';

        function redirectToLoginPage(next = window.location.pathname || '/history') {
            const target = next && next.startsWith('/') ? next : '/history';
            window.location.href = `/login?next=${encodeURIComponent(target)}`;
        }

        async function jsonFetch(url, options = {}) {
            const resp = await fetch(url, { credentials: 'same-origin', ...options });
            if (resp.status === 401) {
                redirectToLoginPage(window.location.pathname + window.location.search);
                throw new Error('UNAUTHORIZED');
            }
            if (resp.status === 403) {
                showPermissionError();
                throw new Error('FORBIDDEN');
            }
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error || data.detail || `请求失败（${resp.status}）`);
            if (!data.success && data.error) throw new Error(data.error);
            return data;
        }

        function showPermissionError() {
            resetDetailSelection();
            ++listRequestId; // Ignore in-flight data after the permission screen takes over.
            document.getElementById('admin-link').hidden = true;
            document.querySelector('.layout').innerHTML = `
                <section class="panel permission-state">
                    <div class="permission-copy">
                        <i class="fas fa-lock permission-icon" aria-hidden="true"></i>
                        <h2>当前账号没有历史记录权限</h2>
                        <p>历史记录、音频下载和导出现在仅管理员可访问。请让管理员在后台把当前账号设为管理员，或使用管理员账号登录。</p>
                    </div>
                </section>`;
        }

        async function bootstrapAuthUser() {
            try {
                const data = await jsonFetch('/api/auth/me');
                currentAuthUser = data.user;
                const displayName = currentAuthUser.display_name || currentAuthUser.username || '已登录用户';
                document.getElementById('auth-user-name').textContent = displayName;
                document.getElementById('auth-user-chip').title = `${displayName} (${currentAuthUser.username})`;
                if (String(currentAuthUser.role || '').toLowerCase() !== 'admin') {
                    showPermissionError();
                    return false;
                }
                document.getElementById('admin-link').hidden = false;
                return true;
            } catch (err) {
                if (!['UNAUTHORIZED', 'FORBIDDEN'].includes(err.message)) {
                    console.error('auth bootstrap failed', err);
                    redirectToLoginPage(window.location.pathname + window.location.search);
                }
                return false;
            }
        }

        async function logoutCurrentUser() {
            const btn = document.getElementById('logout-btn');
            if (btn) btn.disabled = true;
            try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }); }
            finally { redirectToLoginPage('/history'); }
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        function formatDateTime(value) {
            if (!value) return '未知时间';
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('zh-CN');
        }
        function formatDateShort(value) {
            if (!value) return '未知';
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? String(value).slice(0, 16) : date.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' }) + ' ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }
        function formatDuration(value) {
            const num = Number(value || 0);
            if (!Number.isFinite(num) || num <= 0) return '未知';
            if (num >= 60) return `${Math.floor(num / 60)}分${Math.round(num % 60)}秒`;
            return `${num.toFixed(1)}秒`;
        }
        function normalizePatientName(session) {
            return (session.patient_name || session?.profile?.name || '').trim() || '未命名用户';
        }
        function sessionMode(session) {
            return String(session?.mode || session?.session?.mode || 'wellbeing').trim().toLowerCase() || 'wellbeing';
        }

        function modeLabel(session) {
            return sessionMode(session) === 'wellbeing' ? '心理健康陪伴' : '历史会话';
        }

        function getLastActivity(session) {
            return session.last_activity_at || session.ended_at || session.created_at || '';
        }
        function resolveApiUrl(url) {
            if (!url) return '';
            if (/^https?:\/\//i.test(url)) return url;
            if (url.startsWith('/')) return `${API_BASE}${url}`;
            return `${API_BASE}/${url}`;
        }
        function downloadByUrl(url) {
            if (!url) return;
            const a = document.createElement('a');
            a.href = resolveApiUrl(url);
            a.target = '_blank';
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        async function refreshSessions() {
            const listEl = document.getElementById('session-list');
            if (!listEl) return; // The permission screen has no record controls.
            const requestId = ++listRequestId;
            listEl.setAttribute('aria-busy', 'true');
            listEl.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin" aria-hidden="true"></i>正在加载会话...</div>';
            try {
                const data = await jsonFetch(`${API_BASE}/api/sessions?limit=300`);
                if (requestId !== listRequestId) return;
                sessions = data.sessions || [];
                if (selectedSessionId && !sessions.some(session => session.session_id === selectedSessionId)) resetDetailSelection();
                applyFilters();
                if (!selectedSessionId && filteredSessions.length) openDetail(filteredSessions[0].session_id);
            } catch (err) {
                if (requestId !== listRequestId) return;
                if (!['UNAUTHORIZED', 'FORBIDDEN'].includes(err.message)) {
                    listEl.innerHTML = `<div class="empty">加载失败：${escapeHtml(err.message)}。请点击顶部的“刷新记录”重试。</div>`;
                }
            } finally {
                if (requestId === listRequestId) listEl.setAttribute('aria-busy', 'false');
            }
        }

        function clearFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('status-filter').value = 'all';
            document.getElementById('sort-select').value = 'recent';
            applyFilters();
        }

        function applyFilters() {
            const q = document.getElementById('search-input').value.trim().toLowerCase();
            const status = document.getElementById('status-filter').value;
            const sort = document.getElementById('sort-select').value;
            filteredSessions = sessions.filter((session) => {
                const ended = !!session.ended_at;
                if (status === 'active' && ended) return false;
                if (status === 'ended' && !ended) return false;
                if (!q) return true;
                const haystack = [
                    normalizePatientName(session), session.session_id, session.patient_gender,
                    session.owner_username, session.owner_display_name
                ].join(' ').toLowerCase();
                return haystack.includes(q);
            });
            filteredSessions.sort((a, b) => {
                if (sort === 'audio-desc') return Number(b.audio_count || 0) - Number(a.audio_count || 0);
                return String(getLastActivity(b)).localeCompare(String(getLastActivity(a)));
            });
            renderStats();
            renderSessionList();
        }

        function renderStats() {
            const active = filteredSessions.filter(s => !s.ended_at).length;
            const audioCount = filteredSessions.reduce((sum, s) => sum + Number(s.audio_count || 0), 0);
            const messageCount = filteredSessions.reduce((sum, s) => sum + Number(s.message_count || 0), 0);
            document.getElementById('stat-sessions').textContent = filteredSessions.length;
            document.getElementById('stat-active').textContent = active;
            document.getElementById('stat-audio').textContent = audioCount;
            document.getElementById('stat-messages').textContent = messageCount;
            document.getElementById('list-meta').textContent = '显示 ' + filteredSessions.length + ' / ' + sessions.length + ' 条';
        }

        function renderSessionList() {
            const listEl = document.getElementById('session-list');
            if (!filteredSessions.length) {
                listEl.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i><br>没有匹配的会话</div>';
                return;
            }
            listEl.innerHTML = filteredSessions.map(renderSessionRow).join('');
            listEl.querySelectorAll('.session-row').forEach(row => {
                const active = row.dataset.sessionId === selectedSessionId;
                row.classList.toggle('active', active);
                row.querySelector('.session-open').setAttribute('aria-current', String(active));
            });
        }

        function renderSessionRow(session) {
            const name = normalizePatientName(session);
            const gender = session.patient_gender || '';
            const age = session.patient_age ? `${session.patient_age}岁` : '';
            const ended = !!session.ended_at;
            const statusBadge = ended ? '<span class="badge">已结束</span>' : '<span class="badge ok">进行中</span>';
            const owner = session.owner_display_name || session.owner_username || '未归属';
            return `
                <div class="session-row" data-session-id="${escapeHtml(session.session_id)}">
                    <button class="session-main session-open" type="button" onclick="openDetail(this.closest('.session-row').dataset.sessionId)" aria-label="查看 ${escapeHtml(name)} 的陪伴记录">
                        <span class="session-name-line">
                            <span class="session-name">${escapeHtml(name)}</span>
                            ${gender ? `<span class="badge blue">${escapeHtml(gender)}</span>` : ''}
                            ${age ? `<span class="badge">${escapeHtml(age)}</span>` : ''}
                        </span>
                        <span class="session-id">${escapeHtml(session.session_id)}</span>
                        <span class="session-time"><i class="fas fa-clock"></i>${escapeHtml(formatDateShort(getLastActivity(session)))} · ${escapeHtml(owner)}</span>
                        <span class="badges">
                            <span class="badge blue">${escapeHtml(modeLabel(session))}</span>
                            ${statusBadge}
                            <span class="badge"><i class="fas fa-comments"></i>${Number(session.message_count || 0)}</span>
                            <span class="badge"><i class="fas fa-headphones"></i>${Number(session.audio_count || 0)}</span>
                        </span>
                    </button>
                    <button type="button" class="btn icon danger session-delete" title="删除会话" aria-label="删除会话" onclick="deleteSession(this.closest('.session-row').dataset.sessionId, this)"><i class="fas fa-trash"></i></button>
                </div>`;
        }

        function resetDetailSelection() {
            ++detailRequestId;
            selectedSessionId = '';
            currentDetail = null;
            const detail = document.getElementById('detail-content');
            if (detail) {
                detail.classList.remove('open');
                detail.setAttribute('aria-busy', 'false');
            }
            const empty = document.getElementById('detail-empty');
            if (empty) empty.style.display = '';
            document.querySelectorAll('.detail-actions button').forEach(button => { button.disabled = true; });
        }

        async function openDetail(sessionId) {
            if (!document.getElementById('detail-content')) return;
            selectedSessionId = sessionId;
            const requestId = ++detailRequestId;
            currentDetail = null;
            document.getElementById('detail-content').setAttribute('aria-busy', 'true');
            document.querySelectorAll('.detail-actions button').forEach(button => { button.disabled = true; });
            document.getElementById('detail-name').textContent = '正在加载会话…';
            document.getElementById('detail-sub').textContent = '';
            document.querySelectorAll('.metric-strip .value').forEach(value => { value.textContent = '—'; });
            document.querySelectorAll('.session-row').forEach(row => {
                const active = row.dataset.sessionId === sessionId;
                row.classList.toggle('active', active);
                row.querySelector('.session-open').setAttribute('aria-current', String(active));
            });
            document.getElementById('detail-empty').style.display = 'none';
            document.getElementById('detail-content').classList.add('open');
            document.getElementById('tab-messages').innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i>正在加载详情...</div>';
            document.getElementById('tab-audio').innerHTML = '';
            switchTab('messages');
            try {
                const data = await jsonFetch(`${API_BASE}/api/sessions/${encodeURIComponent(sessionId)}`);
                if (requestId !== detailRequestId) return;
                currentDetail = data;
                document.querySelectorAll('.detail-actions button').forEach(button => { button.disabled = false; });
                renderDetail(data);
            } catch (err) {
                if (requestId !== detailRequestId) return;
                document.getElementById('detail-name').textContent = '暂时无法加载会话';
                if (!['UNAUTHORIZED', 'FORBIDDEN'].includes(err.message)) {
                    document.getElementById('tab-messages').innerHTML = `<div class="empty">加载失败：${escapeHtml(err.message)}。请重新选择会话或刷新记录。</div>`;
                }
            } finally {
                if (requestId === detailRequestId) document.getElementById('detail-content').setAttribute('aria-busy', 'false');
            }
        }

        function renderDetail(data) {
            const s = data.session || {};
            const name = normalizePatientName(s);
            const audios = data.audio_files || [];
            const messages = data.messages || [];
            const owner = s.owner_display_name || s.owner_username || '未归属';
            document.getElementById('detail-name').textContent = name;
            document.getElementById('detail-sub').innerHTML = [
                escapeHtml(modeLabel(s)),
                s.patient_age ? `${escapeHtml(s.patient_age)}岁` : '',
                s.patient_gender ? escapeHtml(s.patient_gender) : '',
                `开始 ${escapeHtml(formatDateTime(s.created_at))}`,
                s.ended_at ? `结束 ${escapeHtml(formatDateTime(s.ended_at))}` : '进行中'
            ].filter(Boolean).map(x => `<span>${x}</span>`).join('');
            document.getElementById('metric-mode').textContent = modeLabel(s);
            document.getElementById('metric-messages').textContent = messages.length;
            document.getElementById('metric-audio').textContent = audios.length;
            document.getElementById('metric-status').textContent = s.ended_at ? '已结束' : '进行中';
            document.getElementById('metric-owner').textContent = owner;
            document.getElementById('resume-btn').disabled = !!s.ended_at || sessionMode(s) !== 'wellbeing';
            document.getElementById('delete-btn').disabled = false;
            renderMessages(messages);
            renderAudio(data.session?.session_id || s.session_id, audios);
        }

        function renderMessages(messages) {
            const el = document.getElementById('tab-messages');
            if (!messages.length) { el.innerHTML = '<div class="empty">暂无对话记录</div>'; return; }
            el.innerHTML = `<div class="timeline">${messages.map((m) => {
                const isUser = m.role === 'user';
                return `<div class="message ${isUser ? 'user' : 'assistant'}">
                    <div class="avatar"><i class="fas ${isUser ? 'fa-user' : 'fa-robot'}"></i></div>
                    <div class="bubble">
                        <div class="bubble-text">${escapeHtml(m.content || '')}</div>
                        <div class="bubble-meta">${isUser ? '用户' : '陪伴助手'} · ${escapeHtml(formatDateTime(m.created_at))}</div>
                    </div>
                </div>`;
            }).join('')}</div>`;
        }

        function renderAudio(sessionId, audios) {
            const el = document.getElementById('tab-audio');
            if (!audios.length) { el.innerHTML = '<div class="empty">暂无可回放音频</div>'; return; }
            const counters = { user: 0, assistant: 0 };
            el.innerHTML = `
                <div class="audio-toolbar">
                    <div class="panel-meta">共 ${audios.length} 条音频，按采集时间排列</div>
                    <div class="button-row">
                        <button class="btn" onclick="downloadCurrentMergedAudio()"><i class="fas fa-wave-square"></i>总音频</button>
                        <button class="btn" onclick="downloadCurrentAudioZip()"><i class="fas fa-file-zipper"></i>音频包</button>
                    </div>
                </div>
                <div class="audio-list">${audios.map((audio) => {
                    const role = audio.role === 'assistant' ? 'assistant' : 'user';
                    counters[role] = (counters[role] || 0) + 1;
                    const roleLabel = audio.role_label || (role === 'assistant' ? '系统语音' : '用户语音');
                    return `<div class="audio-row">
                        <div class="audio-head">
                            <div class="audio-title"><span class="badge ${role === 'assistant' ? 'warn' : 'blue'}">${escapeHtml(roleLabel)}</span><span>${escapeHtml(roleLabel)} ${counters[role]}</span></div>
                            <button class="btn" onclick="downloadByUrl('${escapeHtml(resolveApiUrl(audio.download_url || ''))}')"><i class="fas fa-download"></i>下载</button>
                        </div>
                        <audio controls preload="none" src="${escapeHtml(resolveApiUrl(audio.audio_url || ''))}"></audio>
                        <div class="audio-text">${escapeHtml(formatDateTime(audio.created_at))} · ${escapeHtml(formatDuration(audio.duration_s))} · ${escapeHtml(audio.display_text || audio.content_text || audio.asr_text || audio.file_name || '暂无文本')}</div>
                    </div>`;
                }).join('')}</div>`;
        }

        function switchTab(tab) {
            if (!['messages', 'audio'].includes(tab)) tab = 'messages';
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const active = btn.dataset.tab === tab;
                btn.classList.toggle('active', active);
                btn.setAttribute('aria-selected', String(active));
                btn.tabIndex = active ? 0 : -1;
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                const active = content.id === `tab-${tab}`;
                content.classList.toggle('active', active);
                content.hidden = !active;
            });
        }

        function currentSessionId() {
            return currentDetail?.session?.session_id || '';
        }
        async function deleteCurrentSession() {
            const sid = currentSessionId();
            if (sid) await deleteSession(sid);
        }
        async function deleteSession(sessionId, trigger = null) {
            const session = sessions.find(item => item.session_id === sessionId) || {};
            const name = normalizePatientName(session);
            if (!await window.CompanionUI.confirm({ title: '删除这条陪伴记录？', message: `将删除 ${name} 的这条会话及其消息、音频，用户档案会保留。此操作无法撤销。`, confirmText: '删除记录', destructive: true })) return;
            if (trigger) trigger.disabled = true;
            try {
                await jsonFetch(`${API_BASE}/api/sessions/${encodeURIComponent(sessionId)}`, { method: 'DELETE' });
                sessions = sessions.filter(item => item.session_id !== sessionId);
                if (selectedSessionId === sessionId) resetDetailSelection();
                applyFilters();
                if (!selectedSessionId && filteredSessions.length) openDetail(filteredSessions[0].session_id);
            } catch (err) {
                if (trigger) trigger.disabled = false;
                if (!['UNAUTHORIZED', 'FORBIDDEN'].includes(err.message)) await window.CompanionUI.alert({ title: '删除失败', message: `${err.message}。请刷新后重试。` });
            }
        }
        function resumeCurrentSession() {
            if (sessionMode(currentDetail?.session || {}) !== 'wellbeing') return;
            const sid = currentSessionId();
            if (!sid) return;
            try { localStorage.setItem('voice_session_id', sid); } catch (_) {}
            window.location.href = '/';
        }
        function buildCsvContent(data) {
            const rows = [['序号', '角色', '时间', '内容']];
            (data.messages || []).forEach((message, index) => {
                rows.push([index + 1, message.role === 'user' ? '用户' : '陪伴助手', message.created_at || '', message.content || '']);
            });
            const cell = value => {
                let text = String(value ?? '');
                // 对话内容是用户输入，防止表格软件将其当作公式执行。
                if (/^[=+@\-\t\r]/.test(text)) text = "'" + text;
                return '"' + text.replace(/"/g, '""') + '"';
            };
            return '\uFEFF' + rows.map(row => row.map(cell).join(',')).join('\r\n');
        }
        function exportCurrentCsv() {
            if (!currentDetail) return;
            downloadRecord(buildCsvContent(currentDetail), normalizePatientName(currentDetail.session || {}), currentSessionId(), 'csv', 'text/csv');
        }
        function downloadCurrentMergedAudio() {
            const sid = currentSessionId();
            if (sid) downloadByUrl(`/api/sessions/${encodeURIComponent(sid)}/export/audio-merged.wav`);
        }
        function downloadCurrentAudioZip() {
            const sid = currentSessionId();
            if (sid) downloadByUrl(`/api/sessions/${encodeURIComponent(sid)}/export/audio-clips.zip`);
        }
        function exportCurrentTxt() {
            if (!currentDetail) return;
            const txt = buildTxtContent(currentDetail);
            const name = currentDetail.session?.patient_name || '未知';
            downloadRecord(txt, name, currentSessionId());
        }
        function buildTxtContent(data) {
            const s = data.session || {};
            const lines = [
                '心语陪伴 · 会话记录',
                '='.repeat(36),
                '用户姓名: ' + normalizePatientName(s),
                '会话类型: ' + modeLabel(s),
                '年龄: ' + (s.patient_age || '未填写'),
                '性别: ' + (s.patient_gender || '未填写'),
                '开始时间: ' + (s.created_at || ''),
                '结束时间: ' + (s.ended_at || '进行中'),
                '', '对话记录', '-'.repeat(36),
            ];
            (data.messages || []).forEach((m, i) => {
                lines.push('[' + String(i + 1).padStart(3, '0') + '] ' + (m.role === 'user' ? '用户' : '陪伴助手') + ' ' + (m.created_at || ''));
                lines.push(m.content || '', '');
            });
            return lines.join('\n');
        }
        function downloadRecord(content, name, sessionId, extension = 'txt', mimeType = 'text/plain') {
            const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = '陪伴记录_' + name + '_' + String(sessionId || '').slice(0, 16) + '.' + extension;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        bootstrapAuthUser().then((ready) => {
            if (ready) refreshSessions();
        });
    </script>
</body>
</html>
